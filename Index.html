<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كويز الوراثة - المرحلة الثانوية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --card: #1a2236;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: rgba(59,130,246,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(59,130,246,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(6,182,212,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  .dna-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0.03;
    background-image: repeating-linear-gradient(
      45deg,
      var(--accent) 0px, var(--accent) 1px,
      transparent 1px, transparent 40px
    );
  }

  .container {
    width: 100%;
    max-width: 720px;
    position: relative;
    z-index: 1;
  }

  /* SCREENS */
  .screen { display: none; animation: fadeIn 0.5s ease; }
  .screen.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* INTRO SCREEN */
  .intro-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 0 80px rgba(59,130,246,0.08);
  }

  .dna-icon {
    font-size: 64px;
    margin-bottom: 20px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .intro-card h1 {
    font-size: 2.4rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .intro-card .subtitle {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 32px;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 36px;
  }

  .stat-item {
    background: rgba(59,130,246,0.08);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px;
    text-align: center;
  }

  .stat-item .num {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--accent);
  }

  .stat-item .lbl {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .btn-start {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px 48px;
    font-size: 1.2rem;
    font-weight: 800;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 32px rgba(59,130,246,0.3);
    letter-spacing: 0.5px;
  }

  .btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(59,130,246,0.4);
  }

  /* QUIZ SCREEN */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .progress-wrap {
    flex: 1;
    min-width: 200px;
  }

  .progress-label {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 999px;
    transition: width 0.5s ease;
  }

  .score-badge {
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: 10px;
    padding: 8px 16px;
    font-weight: 800;
    color: var(--gold);
    font-size: 0.95rem;
  }

  .timer-badge {
    background: rgba(59,130,246,0.12);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 16px;
    font-weight: 800;
    color: var(--accent2);
    font-size: 0.95rem;
    min-width: 70px;
    text-align: center;
    transition: background 0.3s, color 0.3s;
  }

  .timer-badge.urgent {
    background: rgba(239,68,68,0.15);
    border-color: rgba(239,68,68,0.4);
    color: var(--red);
    animation: pulse 0.6s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    margin-bottom: 20px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.3);
  }

  .question-num {
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  .question-text {
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.6;
    color: var(--text);
  }

  .options-grid {
    display: grid;
    gap: 12px;
  }

  .option-btn {
    background: var(--surface);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 16px 20px;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    text-align: right;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(59,130,246,0.08);
    transform: translateX(-4px);
  }

  .option-btn.correct {
    border-color: var(--green);
    background: rgba(16,185,129,0.12);
    color: var(--green);
  }

  .option-btn.wrong {
    border-color: var(--red);
    background: rgba(239,68,68,0.1);
    color: var(--red);
  }

  .option-letter {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.85rem;
    flex-shrink: 0;
    color: var(--muted);
    transition: all 0.25s;
  }

  .option-btn.correct .option-letter { background: var(--green); color: white; }
  .option-btn.wrong .option-letter { background: var(--red); color: white; }

  .feedback-bar {
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 20px;
    font-weight: 700;
    font-size: 1rem;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .feedback-bar.correct {
    background: rgba(16,185,129,0.12);
    border: 1px solid rgba(16,185,129,0.3);
    color: var(--green);
    display: block;
  }

  .feedback-bar.wrong {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
    display: block;
  }

  .btn-next {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: 800;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    transition: all 0.3s;
    display: none;
  }

  .btn-next:hover { opacity: 0.9; transform: translateY(-1px); }

  /* RESULT SCREEN */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 0 80px rgba(59,130,246,0.08);
  }

  .trophy { font-size: 72px; margin-bottom: 16px; display: block; }

  .result-card h2 {
    font-size: 2rem;
    font-weight: 900;
    margin-bottom: 8px;
  }

  .result-card .result-msg {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 32px;
  }

  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) 0%, var(--accent2) var(--pct), rgba(255,255,255,0.06) var(--pct));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 32px;
    position: relative;
  }

  .score-circle::before {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: var(--card);
  }

  .score-inner {
    position: relative;
    z-index: 1;
    font-size: 2rem;
    font-weight: 900;
    color: var(--text);
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }

  .result-stat {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 16px 12px;
  }

  .result-stat .val {
    font-size: 1.8rem;
    font-weight: 900;
  }

  .result-stat .val.g { color: var(--green); }
  .result-stat .val.r { color: var(--red); }
  .result-stat .val.b { color: var(--accent2); }

  .result-stat .lbl {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .btn-retry {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px 40px;
    font-size: 1.1rem;
    font-weight: 800;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 32px rgba(59,130,246,0.3);
  }

  .btn-retry:hover { transform: translateY(-2px); }

  .grade-label {
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="dna-bg"></div>
<div class="container">

  <!-- INTRO -->
  <div class="screen active" id="screen-intro">
    <div class="intro-card">
      <span class="dna-icon">🧬</span>
      <h1>كويز الوراثة</h1>
      <p class="subtitle">اختبر معلوماتك في علم الوراثة — المرحلة الثانوية</p>
      <div class="stats-row">
        <div class="stat-item">
          <div class="num">10</div>
          <div class="lbl">أسئلة</div>
        </div>
        <div class="stat-item">
          <div class="num">20</div>
          <div class="lbl">ثانية / سؤال</div>
        </div>
        <div class="stat-item">
          <div class="num">10</div>
          <div class="lbl">نقاط / إجابة</div>
        </div>
      </div>
      <button class="btn-start" onclick="startQuiz()">ابدأ المسابقة ←</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <div class="quiz-header">
      <div class="progress-wrap">
        <div class="progress-label" id="progress-label">السؤال 1 من 10</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:10%"></div>
        </div>
      </div>
      <div class="score-badge">⭐ <span id="score-display">0</span> نقطة</div>
      <div class="timer-badge" id="timer-badge">⏱ 20</div>
    </div>

    <div class="question-card">
      <div class="question-num" id="q-num">السؤال 1</div>
      <div class="question-text" id="q-text"></div>
    </div>

    <div class="options-grid" id="options-grid"></div>

    <div class="feedback-bar" id="feedback-bar"></div>

    <button class="btn-next" id="btn-next" onclick="nextQuestion()">السؤال التالي ←</button>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="result-card">
      <span class="trophy" id="result-trophy">🏆</span>
      <div class="grade-label" id="result-grade"></div>
      <p class="result-msg" id="result-msg"></p>

      <div class="score-circle" id="score-circle">
        <div class="score-inner" id="result-pct"></div>
      </div>

      <div class="result-stats">
        <div class="result-stat">
          <div class="val g" id="correct-count">0</div>
          <div class="lbl">إجابات صحيحة</div>
        </div>
        <div class="result-stat">
          <div class="val r" id="wrong-count">0</div>
          <div class="lbl">إجابات خاطئة</div>
        </div>
        <div class="result-stat">
          <div class="val b" id="final-score">0</div>
          <div class="lbl">مجموع النقاط</div>
        </div>
      </div>

      <button class="btn-retry" onclick="restartQuiz()">🔄 حاول مرة أخرى</button>
    </div>
  </div>

</div>

<script>
const questions = [
  {
    q: "من هو عالم الوراثة الأول الذي وضع أسس علم الوراثة من خلال تجاربه على نبات البازلاء؟",
    opts: ["تشارلز داروين", "غريغور مندل", "جيمس واتسون", "لويس باستور"],
    ans: 1
  },
  {
    q: "ما الاسم العلمي للوحدة الأساسية التي تحمل المعلومات الوراثية وتنتقل من الآباء إلى الأبناء؟",
    opts: ["الكروموسوم", "الريبوسوم", "الجين", "الميتوكوندريا"],
    ans: 2
  },
  {
    q: "كم عدد الكروموسومات في الخلية الجسدية الطبيعية لدى الإنسان؟",
    opts: ["23 كروموسوم", "46 كروموسوم", "48 كروموسوم", "64 كروموسوم"],
    ans: 1
  },
  {
    q: "إذا كان الطراز الجيني لنبات البازلاء هو (Aa)، فكيف يُسمى هذا الطراز؟",
    opts: ["متماثل السائد", "متماثل المتنحي", "غير متماثل (هجين)", "ثنائي السيادة"],
    ans: 2
  },
  {
    q: "ما نسبة الطرز الجينية المتوقعة في نسل تزاوج (Aa × Aa) وفق مربع باننت؟",
    opts: ["AA:Aa:aa = 1:1:1", "AA:Aa:aa = 1:2:1", "AA:Aa = 1:1", "Aa:aa = 2:1"],
    ans: 1
  },
  {
    q: "الصفة التي تظهر في الجيل الأول عند التزاوج بين سلالتين نقيتين تُسمى:",
    opts: ["الصفة المتنحية", "الصفة السائدة", "الصفة الوسيطة", "الطفرة الجينية"],
    ans: 1
  },
  {
    q: "ما الاسم الصحيح للطراز الجيني (AA)؟",
    opts: ["متغاير الزيجوت", "متماثل الزيجوت", "هجين", "ثنائي الأليل"],
    ans: 1
  },
  {
    q: "الحمض النووي DNA يتكون من أربعة قواعد نيتروجينية، أيٌّ من التالي ليس منها؟",
    opts: ["الأدنين (A)", "الثايمين (T)", "الأوراسيل (U)", "الجوانين (G)"],
    ans: 2
  },
  {
    q: "أي قانون من قوانين مندل يُعبّر عن أن أليلات الجينات المختلفة توزّع في البويضات والحيوانات المنوية بصورة مستقلة؟",
    opts: ["قانون الفصل", "قانون التوزيع المستقل", "قانون السيادة", "قانون الانتقاء الطبيعي"],
    ans: 1
  },
  {
    q: "الأمراض الوراثية المرتبطة بالكروموسوم X تنتشر بشكل أكبر لدى:",
    opts: ["الإناث فقط", "الذكور فقط", "الذكور أكثر من الإناث", "الإناث أكثر من الذكور"],
    ans: 2
  }
];

let current = 0;
let score = 0;
let correct = 0;
let wrong = 0;
let timer;
let timeLeft;
let answered = false;
const letters = ['أ', 'ب', 'ج', 'د'];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  current = 0; score = 0; correct = 0; wrong = 0;
  showScreen('screen-quiz');
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  clearInterval(timer);
  timeLeft = 20;

  const q = questions[current];
  document.getElementById('q-num').textContent = `السؤال ${current + 1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress-label').textContent = `السؤال ${current + 1} من ${questions.length}`;
  document.getElementById('progress-fill').style.width = `${((current + 1) / questions.length) * 100}%`;
  document.getElementById('score-display').textContent = score;

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${letters[i]}</span>${opt}`;
    btn.onclick = () => selectAnswer(i, btn);
    grid.appendChild(btn);
  });

  document.getElementById('feedback-bar').className = 'feedback-bar';
  document.getElementById('feedback-bar').textContent = '';
  document.getElementById('btn-next').style.display = 'none';

  updateTimer();
  timer = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timer);
      if (!answered) timeOut();
    }
  }, 1000);
}

function updateTimer() {
  const el = document.getElementById('timer-badge');
  el.textContent = `⏱ ${timeLeft}`;
  el.className = timeLeft <= 5 ? 'timer-badge urgent' : 'timer-badge';
}

function selectAnswer(idx, btn) {
  if (answered) return;
  answered = true;
  clearInterval(timer);

  const q = questions[current];
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback-bar');

  if (idx === q.ans) {
    btn.classList.add('correct');
    btn.querySelector('.option-letter').style.background = 'var(--green)';
    btn.querySelector('.option-letter').style.color = 'white';
    score += 10;
    correct++;
    fb.textContent = '✅ إجابة صحيحة! أحسنت';
    fb.className = 'feedback-bar correct';
  } else {
    btn.classList.add('wrong');
    btn.querySelector('.option-letter').style.background = 'var(--red)';
    btn.querySelector('.option-letter').style.color = 'white';
    allBtns[q.ans].classList.add('correct');
    allBtns[q.ans].querySelector('.option-letter').style.background = 'var(--green)';
    allBtns[q.ans].querySelector('.option-letter').style.color = 'white';
    wrong++;
    fb.textContent = `❌ إجابة خاطئة. الصحيح: ${q.opts[q.ans]}`;
    fb.className = 'feedback-bar wrong';
  }

  document.getElementById('score-display').textContent = score;
  document.getElementById('btn-next').style.display = 'block';
  document.getElementById('btn-next').textContent = current < questions.length - 1 ? 'السؤال التالي ←' : 'عرض النتيجة 🏆';
}

function timeOut() {
  answered = true;
  const q = questions[current];
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);
  allBtns[q.ans].classList.add('correct');
  wrong++;
  const fb = document.getElementById('feedback-bar');
  fb.textContent = `⏰ انتهى الوقت! الإجابة الصحيحة: ${q.opts[q.ans]}`;
  fb.className = 'feedback-bar wrong';
  document.getElementById('btn-next').style.display = 'block';
  document.getElementById('btn-next').textContent = current < questions.length - 1 ? 'السؤال التالي ←' : 'عرض النتيجة 🏆';
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  clearInterval(timer);
  showScreen('screen-result');
  const pct = Math.round((correct / questions.length) * 100);

  let trophy, grade, msg;
  if (pct >= 90) { trophy = '🏆'; grade = 'ممتاز!'; msg = 'أداء رائع! أنت متميز في علم الوراثة'; }
  else if (pct >= 70) { trophy = '🥈'; grade = 'جيد جداً'; msg = 'أداء جيد جداً، استمر في التعلم!'; }
  else if (pct >= 50) { trophy = '🥉'; grade = 'جيد'; msg = 'تحتاج لمراجعة بعض المفاهيم'; }
  else { trophy = '📚'; grade = 'بحاجة لمراجعة'; msg = 'راجع الدرس وحاول مرة أخرى!'; }

  document.getElementById('result-trophy').textContent = trophy;
  document.getElementById('result-grade').textContent = grade;
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-pct').textContent = `${pct}%`;
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('wrong-count').textContent = wrong;
  document.getElementById('final-score').textContent = score;
  document.getElementById('score-circle').style.setProperty('--pct', `${pct}%`);
}

function restartQuiz() {
  showScreen('screen-intro');
}
</script>
